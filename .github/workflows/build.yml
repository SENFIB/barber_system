name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'کدام بیلد؟'
        type: choice
        default: both
        options:
          - both
          - android
          - windows
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'android' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            ok=0
            for url in \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"; do
              curl -fsSL --retry 3 "$url" -o "assets/fonts/Vazirmatn-$w.ttf" || continue
              size=$(wc -c < "assets/fonts/Vazirmatn-$w.ttf")
              if [ "$size" -gt 50000 ]; then ok=1; break; fi
            done
            if [ "$ok" != "1" ]; then
              echo "font download failed: $w"
              exit 1
            fi
          done
          ls -l assets/fonts
      - name: Signing key (created once, then reused)
        run: |
          if [ ! -f ../keystore/esmairo.jks ]; then
            mkdir -p ../keystore
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -v -keystore ../keystore/esmairo.jks -alias esmairo -keyalg RSA -keysize 2048 -validity 12000 -storepass "$PASS" -keypass "$PASS" -dname "CN=ESMAIRO, O=ESMAIRO, C=IR"
            echo "$PASS" > ../keystore/pass.txt
            cd ..
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -f keystore/esmairo.jks keystore/pass.txt
            git commit -m "add signing key [skip ci]"
            git pull --rebase origin main || true
            git push
          else
            echo "signing key already exists"
          fi
      - name: Generate Android project
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=android ../_gen
          rm -rf android
          cp -r ../_gen/android ./android
          python - <<'PY'
          import os, re
          pw = open('../keystore/pass.txt').read().strip()
          ks = os.path.abspath('../keystore/esmairo.jks')
          # ---- manifest ----
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m).read()
          perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % p for p in ['INTERNET', 'POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE'])
          s = re.sub(r'(<manifest[^>]*>)', lambda mo: mo.group(1) + '\n' + perms, s, count=1)
          s = s.replace('android:label="barber_app"', 'android:label="ESMAIRO"')
          rec = (
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ActionBroadcastReceiver" />\n'
              '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
              '            <intent-filter>\n'
              '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
              '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
              '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
              '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
              '            </intent-filter>\n'
              '        </receiver>\n'
          )
          s = s.replace('</application>', rec + '    </application>', 1)
          open(m, 'w').write(s)
          # ---- gradle: fixed signing + desugaring ----
          d = 'android/app/'
          if os.path.exists(d + 'build.gradle'):
              f = d + 'build.gradle'
              g = open(f).read()
              sign = "    signingConfigs {\n        release {\n            storeFile file('%s')\n            storePassword '%s'\n            keyAlias 'esmairo'\n            keyPassword '%s'\n        }\n    }\n" % (ks, pw, pw)
              g = g.replace('    buildTypes {', sign + '    buildTypes {', 1)
              g = re.sub(r'signingConfig\s*=?\s*signingConfigs\.debug', 'signingConfig signingConfigs.release', g)
              g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n"
              open(f, 'w').write(g)
          else:
              f = d + 'build.gradle.kts'
              g = open(f).read()
              sign = '    signingConfigs {\n        create("release") {\n            storeFile = file("%s")\n            storePassword = "%s"\n            keyAlias = "esmairo"\n            keyPassword = "%s"\n        }\n    }\n' % (ks, pw, pw)
              g = g.replace('    buildTypes {', sign + '    buildTypes {', 1)
              g = re.sub(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)', 'signingConfig = signingConfigs.getByName("release")', g)
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
              open(f, 'w').write(g)
          PY
          grep -n 'label=' android/app/src/main/AndroidManifest.xml
          grep -n 'signingConfig' android/app/build.gradle* || true
      - name: Build icon (ESMAIRO)
        run: |
          python -m pip install --quiet pillow
          python ../tools/make_icon.py android android/app/src/main/res
      - name: Build APK
        run: |
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          flutter pub add flutter_local_notifications:^17.2.4 timezone:^0.9.4
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-name=1.0.$PATCH --build-number=$GITHUB_RUN_NUMBER
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ESMAIRO.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ESMAIRO-android
          path: barber_app/build/app/outputs/flutter-apk/ESMAIRO.apk
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'windows' || inputs.target == 'both' }}
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            ok=0
            for url in \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"; do
              curl -fsSL --retry 3 "$url" -o "assets/fonts/Vazirmatn-$w.ttf" || continue
              size=$(wc -c < "assets/fonts/Vazirmatn-$w.ttf")
              if [ "$size" -gt 50000 ]; then ok=1; break; fi
            done
            if [ "$ok" != "1" ]; then
              echo "font download failed: $w"
              exit 1
            fi
          done
          ls -l assets/fonts
      - name: Generate Windows project
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=windows ../_gen
          rm -rf windows
          cp -r ../_gen/windows ./windows
          sed -i 's/L"barber_app"/L"ESMAIRO"/' windows/runner/main.cpp
          sed -i -E 's/(FileDescription|ProductName)", "barber_app"/\1", "ESMAIRO"/' windows/runner/Runner.rc
          grep -n 'ESMAIRO' windows/runner/main.cpp windows/runner/Runner.rc || true
      - name: Build icon (ESMAIRO)
        run: |
          python -m pip install --quiet pillow
          python ../tools/make_icon.py windows windows/runner/resources/app_icon.ico
      - name: Build Windows
        run: |
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          flutter pub add flutter_local_notifications:^17.2.4 timezone:^0.9.4
          flutter pub get
          flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=1.0.$PATCH --build-number=$GITHUB_RUN_NUMBER
          mv build/windows/x64/runner/Release/barber_app.exe build/windows/x64/runner/Release/ESMAIRO.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ESMAIRO-windows
          path: barber_app/build/windows/x64/runner/Release
