name: Build App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate android folder
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=android ../_gen
          cp -r ../_gen/android android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Version
        id: ver
        run: |
          PATCH=$(( ${{ github.run_number }} - 1 ))
          echo "name=1.0.$PATCH" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build APK
        run: >
          flutter build apk --release --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.number }}

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: barber_app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Generate windows folder
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=windows ../_gen
          cp -r ../_gen/windows windows

      - name: Version
        id: ver
        run: |
          PATCH=$(( ${{ github.run_number }} - 1 ))
          echo "name=1.0.$PATCH" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build Windows
        run: >
          flutter build windows --release --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.number }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: barber_app/build/windows/x64/runner/Release
