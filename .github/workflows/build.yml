name: Build App
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            f="assets/fonts/Vazirmatn-$w.ttf"
            ok=0
            for u in \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@master/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"; do
              if curl -fsSL --retry 3 --retry-delay 2 -o "$f" "$u" && [ "$(wc -c < "$f")" -gt 50000 ]; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "font download failed: $w"
              exit 1
            fi
          done
          ls -l assets/fonts
      - name: Generate android folder
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=android ../_gen
          cp -r ../_gen/android android
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Version
        id: ver
        run: |
          PATCH=$(( ${{ github.run_number }} - 1 ))
          echo "name=1.0.$PATCH" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build APK
        run: >
          flutter build apk --release --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: barber_app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            f="assets/fonts/Vazirmatn-$w.ttf"
            ok=0
            for u in \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@master/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"; do
              if curl -fsSL --retry 3 --retry-delay 2 -o "$f" "$u" && [ "$(wc -c < "$f")" -gt 50000 ]; then
                ok=1
                break
              fi
            done
            if [ "$ok" != "1" ]; then
              echo "font download failed: $w"
              exit 1
            fi
          done
          ls -l assets/fonts
      - name: Generate windows folder
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=windows ../_gen
          cp -r ../_gen/windows windows
      - name: Version
        id: ver
        run: |
          PATCH=$(( ${{ github.run_number }} - 1 ))
          echo "name=1.0.$PATCH" >> "$GITHUB_OUTPUT"
          echo "number=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build Windows
        run: >
          flutter build windows --release --obfuscate
          --split-debug-info=build/symbols
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ steps.ver.outputs.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: barber_app/build/windows/x64/runner/Release
