name: barber_app
description: اپ نوبت‌دهی آرایشگاه (مشتری و آرایشگاه در یک برنامه)
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  barber_core:
    path: ../packages/barber_core
  http: ^1.2.0
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  file_picker: ^8.1.2
  url_launcher: ^6.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
