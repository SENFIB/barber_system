name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'کدام بیلد؟'
        type: choice
        default: android
        options:
          - android
          - windows
          - both

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'android' || inputs.target == 'both')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[android]'))) }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            ok=0
            for url in \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"; do
              curl -fsSL --retry 3 "$url" -o "assets/fonts/Vazirmatn-$w.ttf" || continue
              size=$(wc -c < "assets/fonts/Vazirmatn-$w.ttf")
              if [ "$size" -gt 50000 ]; then ok=1; break; fi
            done
            if [ "$ok" != "1" ]; then
              echo "font download failed: $w"
              exit 1
            fi
          done
          ls -l assets/fonts
      - name: Generate Android project
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=android ../_gen
          rm -rf android
          cp -r ../_gen/android ./android
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#&\n    <uses-permission android:name="android.permission.INTERNET"/>#' "$MANIFEST"
          sed -i 's#android:label="barber_app"#android:label="ESMAIRO"#' "$MANIFEST"
          grep -n 'label=' "$MANIFEST"
      - name: Build icon (ESMAIRO)
        run: |
          python -m pip install --quiet pillow
          python ../tools/make_icon.py android android/app/src/main/res
      - name: Build APK
        run: |
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          flutter pub get
          flutter build apk --release --obfuscate --split-debug-info=build/symbols --build-name=1.0.$PATCH --build-number=$GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: barber_app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'windows' || inputs.target == 'both')) || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build]') || contains(github.event.head_commit.message, '[windows]'))) }}
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: barber_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download Vazirmatn font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            ok=0
            for url in \
              "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-$w.ttf" \
              "https://raw.githubusercontent.com/rastikerdar/vazirmatn/master/fonts/ttf/Vazirmatn-$w.ttf"; do
              curl -fsSL --retry 3 "$url" -o "assets/fonts/Vazirmatn-$w.ttf" || continue
              size=$(wc -c < "assets/fonts/Vazirmatn-$w.ttf")
              if [ "$size" -gt 50000 ]; then ok=1; break; fi
            done
            if [ "$ok" != "1" ]; then
              echo "font download failed: $w"
              exit 1
            fi
          done
          ls -l assets/fonts
      - name: Generate Windows project
        run: |
          flutter create --org com.barberapp --project-name barber_app --platforms=windows ../_gen
          rm -rf windows
          cp -r ../_gen/windows ./windows
          sed -i 's/L"barber_app"/L"ESMAIRO"/' windows/runner/main.cpp
          sed -i -E 's/(FileDescription|ProductName)", "barber_app"/\1", "ESMAIRO"/' windows/runner/Runner.rc
          grep -n 'ESMAIRO' windows/runner/main.cpp windows/runner/Runner.rc || true
      - name: Build icon (ESMAIRO)
        run: |
          python -m pip install --quiet pillow
          python ../tools/make_icon.py windows windows/runner/resources/app_icon.ico
      - name: Build Windows
        run: |
          PATCH=$((GITHUB_RUN_NUMBER - 1))
          flutter pub get
          flutter build windows --release --obfuscate --split-debug-info=build/symbols --build-name=1.0.$PATCH --build-number=$GITHUB_RUN_NUMBER
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: barber_app/build/windows/x64/runner/Release
